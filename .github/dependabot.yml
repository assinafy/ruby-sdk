version: 2
updates:
  # Keep runtime/dev gems patched — catches security advisories (e.g. the
  # faraday/json CVEs) automatically instead of waiting for manual review.
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development

  # Keep the full-SHA GitHub Actions pins current with upstream releases.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
