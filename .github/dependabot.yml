version: 2
updates:
  # Keep runtime/dev gems patched — catches security advisories (e.g. the
  # faraday/json CVEs) automatically instead of on the next manual audit.
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development

  # Keep GitHub Actions references current (and, if pinned to SHAs later,
  # bump those SHAs with changelog links).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
