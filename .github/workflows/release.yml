name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag matches gem version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Compare tag and Assinafy::VERSION
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          gem_version="$(ruby -Ilib -rassinafy/version -e 'print Assinafy::VERSION')"
          if [ "$tag" != "$gem_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Assinafy::VERSION ($gem_version)"
            exit 1
          fi
          echo "Tag matches gem version: $gem_version"

      - name: Run RSpec
        run: bundle exec rake spec

      - name: Run RuboCop
        run: bundle exec rubocop --no-color

      - name: Run Steep
        run: bundle exec steep check

      - name: Run bundler-audit
        run: bundle exec bundler-audit check --update

  publish:
    name: Publish gem
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Build gem
        run: gem build assinafy.gemspec

      - name: Install and require packaged gem
        run: |
          set -euo pipefail
          version="$(ruby -Ilib -rassinafy/version -e 'print Assinafy::VERSION')"
          gem_file="assinafy-${version}.gem"
          gem_home="$RUNNER_TEMP/assinafy-gem-home"
          test -f "$gem_file"
          gem install --local --ignore-dependencies "$gem_file" --install-dir "$gem_home" --no-document
          dependency_gem_path="$(bundle exec ruby -e 'print Gem.path.join(":")')"
          # shellcheck disable=SC2016
          GEM_HOME="$gem_home" GEM_PATH="$gem_home:$dependency_gem_path" ruby -rassinafy -e '
            loaded = $LOADED_FEATURES.find { |path| path.end_with?("/lib/assinafy.rb") }
            gem_home = File.realpath(ENV.fetch("GEM_HOME"))
            abort "packaged gem did not load" unless loaded && File.realpath(loaded).start_with?("#{gem_home}/")
          '

      - name: Configure RubyGems.org trusted publishing
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Push to RubyGems.org
        run: |
          set -euo pipefail
          version="$(ruby -Ilib -rassinafy/version -e 'print Assinafy::VERSION')"
          status="$(curl --silent --show-error --location --output /dev/null \
            --write-out '%{http_code}' --retry 3 \
            "https://rubygems.org/api/v2/rubygems/assinafy/versions/${version}.json")"
          case "$status" in
            200) echo "assinafy $version is already on RubyGems.org; skipping" ;;
            404) gem push assinafy-*.gem ;;
            *) echo "RubyGems.org version check returned HTTP $status" >&2; exit 1 ;;
          esac

      - name: Push to GitHub Packages
        env:
          GEM_HOST_API_KEY: "Bearer ${{ secrets.GITHUB_TOKEN }}"
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(ruby -Ilib -rassinafy/version -e 'print Assinafy::VERSION')"
          response="$RUNNER_TEMP/github-package-versions.json"
          status="$(curl --silent --show-error --location --output "$response" \
            --write-out '%{http_code}' --retry 3 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_PACKAGES_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/orgs/${GITHUB_REPOSITORY_OWNER}/packages/rubygems/assinafy/versions?per_page=100")"
          case "$status" in
            200)
              if PACKAGE_VERSION="$version" ruby -rjson -e '
                versions = JSON.parse(File.binread(ARGV.fetch(0)))
                exit versions.any? { |item| item["name"] == ENV.fetch("PACKAGE_VERSION") } ? 0 : 1
              ' "$response"; then
                echo "assinafy $version is already on GitHub Packages; skipping"
              else
                gem push --host "https://rubygems.pkg.github.com/assinafy" "assinafy-${version}.gem"
              fi
              ;;
            404) gem push --host "https://rubygems.pkg.github.com/assinafy" "assinafy-${version}.gem" ;;
            *) echo "GitHub Packages version check returned HTTP $status" >&2; exit 1 ;;
          esac
