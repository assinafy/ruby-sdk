name: Live Sandbox

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected environment containing the sandbox credentials and test recipients
        required: true
        type: environment

concurrency:
  group: live-sandbox-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  integration:
    name: Assinafy sandbox integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    env:
      ASSINAFY_LIVE: "1"
      ASSINAFY_BASE_URL: https://sandbox.assinafy.com.br/v1
      ASSINAFY_API_KEY: ${{ secrets.ASSINAFY_API_KEY }}
      ASSINAFY_ACCOUNT_ID: ${{ secrets.ASSINAFY_ACCOUNT_ID }}
      ASSINAFY_TEST_EMAIL: ${{ secrets.ASSINAFY_TEST_EMAIL }}
      ASSINAFY_TEST_EMAIL2: ${{ secrets.ASSINAFY_TEST_EMAIL2 }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run sandbox integration suite
        run: bundle exec rspec spec/integration/live_sandbox_spec.rb --format documentation
